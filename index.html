<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>정후이 타로 - 행운을 점쳐보세요</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080915;
      --gold-primary: #f5d061;
      --gold-light: #fff0a6;
      --gold-dark: #b8860b;
      --text-main: #f0f3fa;
      --text-muted: #9aa2ba;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Serif KR', serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px 12px;
    }

    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: translateY(10px);
    }

    .screen.active {
      display: flex !important;
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* 1. 표지 화면 */
    .cover-moon {
      width: 70px;
      height: 70px;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 20px rgba(245, 208, 97, 0.45));
      animation: floatMoon 4s ease-in-out infinite;
    }

    @keyframes floatMoon {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(3deg); }
    }

    .brand-title {
      font-family: 'Cinzel', 'Noto Serif KR', serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #fff 20%, var(--gold-light) 60%, var(--gold-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .brand-sub {
      font-size: 1.05rem;
      color: var(--gold-primary);
      letter-spacing: 1.5px;
      font-weight: 400;
      margin-bottom: 28px;
      text-shadow: 0 0 10px rgba(245, 208, 97, 0.3);
    }

    .btn-start {
      background: linear-gradient(135deg, rgba(245, 208, 97, 0.15), rgba(184, 134, 11, 0.25));
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 14px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(245, 208, 97, 0.25);
      transition: all 0.3s ease;
      animation: pulseBtn 2.2s infinite;
      touch-action: manipulation;
    }

    .btn-start:active {
      transform: scale(0.97);
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 208, 97, 0.2); }
      50% { box-shadow: 0 0 25px rgba(245, 208, 97, 0.5); }
    }

    /* 2. 모바일 10장 짤림 방지 그리드 선택 화면 */
    .deck-instruction {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(245, 208, 97, 0.4);
    }

    .grid-deck-wrapper {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      justify-items: center;
      padding: 2px;
    }

    .tarot-card-grid {
      width: 100%;
      aspect-ratio: 2 / 3.1;
      border-radius: 5px;
      background: linear-gradient(135deg, #10152e 0%, #1c244c 50%, #0d1124 100%);
      border: 1.2px solid var(--gold-primary);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3px;
      touch-action: manipulation;
    }

    .tarot-card-grid .card-inner-frame {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(245, 208, 97, 0.45);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(245, 208, 97, 0.08) 0%, transparent 80%);
      pointer-events: none;
    }

    .tarot-card-grid:active, .tarot-card-grid:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: #fff;
      box-shadow: 0 0 15px rgba(245, 208, 97, 0.8);
    }

    .card-number-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      color: var(--gold-primary);
      font-weight: 700;
    }

    /* 3. 타로 결과 화면 */
    .result-card-container {
      perspective: 1000px;
      width: 130px;
      height: 220px;
      margin: 0 auto 14px;
    }

    .result-card-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
    }

    .result-card-3d.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .card-face.back {
      background: linear-gradient(135deg, #10152e 0%, #1c244c 50%, #0d1124 100%);
      border: 2px solid var(--gold-primary);
    }

    .card-face.front {
      background: linear-gradient(160deg, #181b36 0%, #0b0d1a 100%);
      border: 2px solid var(--gold-primary);
      transform: rotateY(180deg);
      box-shadow: 0 0 25px rgba(245, 208, 97, 0.3);
    }

    .card-number {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      color: var(--gold-primary);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .card-icon {
      font-size: 2.8rem;
      margin: 6px 0;
      filter: drop-shadow(0 0 10px rgba(245, 208, 97, 0.4));
    }

    .card-title-kr {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .card-title-en {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      color: var(--gold-light);
      letter-spacing: 1px;
    }

    .reading-box {
      background: rgba(20, 23, 46, 0.75);
      border: 1px solid rgba(245, 208, 97, 0.3);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      text-align: left;
      width: 100%;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
    }

    .reading-section-title {
      font-size: 0.85rem;
      color: var(--gold-primary);
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .reading-text {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #e2e7f5;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .reading-text:last-child {
      margin-bottom: 0;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .btn-action {
      background: rgba(245, 208, 97, 0.12);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 11px 16px;
      font-size: 0.88rem;
      font-family: inherit;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      width: 100%;
      touch-action: manipulation;
    }

    .btn-action.primary {
      background: linear-gradient(135deg, rgba(245, 208, 97, 0.25), rgba(184, 134, 11, 0.45));
      box-shadow: 0 0 15px rgba(245, 208, 97, 0.25);
    }

    /* 4. 별자리 & 생일 운세 */
    .horoscope-header {
      margin-bottom: 12px;
    }

    .horoscope-title {
      font-size: 1.3rem;
      color: var(--gold-light);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .horoscope-date-badge {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--gold-primary);
      border: 1px solid rgba(245, 208, 97, 0.4);
      padding: 2px 10px;
      border-radius: 20px;
      background: rgba(245, 208, 97, 0.08);
    }

    .input-card {
      background: rgba(20, 23, 46, 0.8);
      border: 1px solid rgba(245, 208, 97, 0.3);
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      margin-bottom: 12px;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      width: 100%;
    }

    .date-input, .select-input {
      background: #0d0f1e;
      border: 1px solid rgba(245, 208, 97, 0.4);
      color: #fff;
      padding: 9px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      width: 100%;
    }

    .horoscope-result-card {
      display: none;
      background: rgba(20, 23, 46, 0.85);
      border: 1.5px solid var(--gold-primary);
      border-radius: 14px;
      padding: 14px 16px;
      width: 100%;
      text-align: left;
      margin-bottom: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .zodiac-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(245, 208, 97, 0.2);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .zodiac-icon {
      font-size: 1.8rem;
    }

    .zodiac-info h3 {
      font-size: 1.05rem;
      color: #fff;
    }

    .zodiac-info p {
      font-size: 0.75rem;
      color: var(--gold-primary);
    }

    .lucky-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(245, 208, 97, 0.2);
    }

    .lucky-chip {
      background: rgba(245, 208, 97, 0.1);
      border: 1px solid rgba(245, 208, 97, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--gold-light);
    }
  </style>
</head>
<body>

  <canvas class="stars-canvas" id="starsCanvas"></canvas>

  <div class="container">
    
    <!-- 1단계: 표지 화면 -->
    <div class="screen active" id="screenCover">
      <svg class="cover-moon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10C27.9086 10 10 27.9086 10 50C10 72.0914 27.9086 90 50 90C59.2082 90 67.7212 86.8856 74.524 81.6567C60.2921 78.4344 49.7222 65.7483 49.7222 50.5C49.7222 35.2517 60.2921 22.5656 74.524 19.3433C67.7212 14.1144 59.2082 10 50 10Z" fill="url(#moonGrad)"/>
        <defs>
          <linearGradient id="moonGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFF3B0"/>
            <stop offset="0.6" stop-color="#F5D061"/>
            <stop offset="1" stop-color="#B8860B"/>
          </linearGradient>
        </defs>
      </svg>
      <h1 class="brand-title">정후이 타로</h1>
      <p class="brand-sub">행운을 점쳐보세요</p>
      <button class="btn-start" id="mainStartBtn" type="button">화면을 터치하여 카드 고르기</button>
    </div>

    <!-- 2단계: 10장 그리드 타로 선택 화면 -->
    <div class="screen" id="screenSpread">
      <div class="deck-instruction">마음에 드는 카드를 한 장 선택하세요</div>
      <div class="grid-deck-wrapper" id="deckWrapper"></div>
    </div>

    <!-- 3단계: 카드 결과 & 해설 화면 -->
    <div class="screen" id="screenResult">
      <div class="result-card-container">
        <div class="result-card-3d" id="resultCard3D">
          <div class="card-face back">
            <div style="font-size:1.5rem; color:var(--gold-primary);">✦</div>
          </div>
          <div class="card-face front" id="cardFrontFace">
            <div class="card-number" id="resCardNum">THE FOOL</div>
            <div class="card-icon" id="resCardIcon">🎒</div>
            <div class="card-title-kr" id="resCardTitleKr">바보</div>
            <div class="card-title-en" id="resCardTitleEn">The Fool</div>
          </div>
        </div>
      </div>

      <div class="reading-box">
        <div class="reading-section-title">✦ 오늘의 행운 메시지</div>
        <p class="reading-text" id="resFortuneText"></p>
        <div class="reading-section-title">✦ 오늘의 실천 조언</div>
        <p class="reading-text" id="resAdviceText"></p>
      </div>

      <div class="btn-group">
        <button class="btn-action primary" id="btnGoHoroscope" type="button">✨ 나의 생일 & 별자리 운세 확인하기</button>
        <button class="btn-action" id="btnReset1" type="button">처음으로 돌아가기</button>
      </div>
    </div>

    <!-- 4단계: 생일 & 별자리 운세 -->
    <div class="screen" id="screenHoroscope">
      <div class="horoscope-header">
        <h2 class="horoscope-title">오늘의 별자리 운세</h2>
        <span class="horoscope-date-badge" id="todayDateBadge"></span>
      </div>

      <div class="input-card">
        <p style="font-size:0.82rem; color:var(--gold-light);">생일 또는 별자리를 선택해 주세요</p>
        <div class="input-row">
          <select class="select-input" id="zodiacSelect">
            <option value="" disabled selected>별자리로 직접 선택</option>
            <option value="0">♈ 양자리 (03.21~04.19)</option>
            <option value="1">♉ 황소자리 (04.20~05.20)</option>
            <option value="2">♊ 쌍둥이자리 (05.21~06.21)</option>
            <option value="3">♋ 게자리 (06.22~07.22)</option>
            <option value="4">♌ 사자자리 (07.23~08.22)</option>
            <option value="5">♍ 처녀자리 (08.23~09.22)</option>
            <option value="6">♎ 천칭자리 (09.23~10.22)</option>
            <option value="7">♏ 전갈자리 (10.23~11.22)</option>
            <option value="8">♐ 궁수자리 (11.23~12.24)</option>
            <option value="9">♑ 염소자리 (12.25~01.19)</option>
            <option value="10">♒ 물병자리 (01.20~02.18)</option>
            <option value="11">♓ 물고기자리 (02.19~03.20)</option>
          </select>
          <input type="date" class="date-input" id="birthdayInput">
        </div>
      </div>

      <div class="horoscope-result-card" id="horoscopeResult">
        <div class="zodiac-badge">
          <div class="zodiac-icon" id="zodiacIcon">♈</div>
          <div class="zodiac-info">
            <h3 id="zodiacName">양자리</h3>
            <p id="zodiacDateSpan">03.21 ~ 04.19</p>
          </div>
        </div>

        <div class="reading-section-title">✦ 총운</div>
        <p class="reading-text" id="zodiacGeneral"></p>

        <div class="reading-section-title">✦ 애정 & 대인관계</div>
        <p class="reading-text" id="zodiacLove"></p>

        <div class="reading-section-title">✦ 재물 & 학업/사업</div>
        <p class="reading-text" id="zodiacMoney"></p>

        <div class="lucky-chips">
          <div class="lucky-chip" id="luckyColor">행운의 색: 골드</div>
          <div class="lucky-chip" id="luckyNum">행운의 수: 7</div>
          <div class="lucky-chip" id="luckyTime">행운의 시간: 14:00</div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-action" id="btnReset2" type="button">처음으로 돌아가기 (다시 점치기)</button>
      </div>
    </div>

  </div>

  <script>
    /* 1. 배경 별빛 */
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = Array.from({ length: 45 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.2 + 0.4,
        alpha: Math.random() * 0.7 + 0.3,
        speed: Math.random() * 0.015 + 0.005
      }));
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245, 208, 97, ${Math.abs(s.alpha)})`;
        ctx.fill();
      });
      requestAnimationFrame(animateStars);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateStars();

    /* 2. 안전한 Web Audio 효과음 */
    let audioCtx = null;

    function getAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
      return audioCtx;
    }

    function playCardShuffleSound() {
      try {
        const actx = getAudioContext();
        if (!actx) return;
        for (let i = 0; i < 4; i++) {
          setTimeout(() => {
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140 + Math.random() * 100, actx.currentTime);
            gain.gain.setValueAtTime(0.02, actx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.06);
            osc.connect(gain);
            gain.connect(actx.destination);
            osc.start();
            osc.stop(actx.currentTime + 0.06);
          }, i * 35);
        }
      } catch (e) {}
    }

    function playChimeSound() {
      try {
        const actx = getAudioContext();
        if (!actx) return;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, actx.currentTime);
            gain.gain.setValueAtTime(0.05, actx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.9);
            osc.connect(gain);
            gain.connect(actx.destination);
            osc.start();
            osc.stop(actx.currentTime + 0.9);
          }, idx * 100);
        });
      } catch (e) {}
    }

    /* 3. 메이저 타로 22장 데이터 */
    const tarotDeck = [
      { num: "0", nameKr: "바보", nameEn: "The Fool", icon: "🎒", fortune: "새로운 시작과 순수한 호기심이 가득한 날입니다. 망설이던 일이 있다면 일단 발걸음을 떼어보세요.", advice: "주변의 시선을 두려워하지 말고, 당신의 직관과 호기심을 믿고 가볍게 시도해 보세요." },
      { num: "I", nameKr: "마법사", nameEn: "The Magician", icon: "🪄", fortune: "당신이 가진 모든 잠재력과 재능이 빛을 발하는 기운입니다. 아이디어가 현실로 바뀔 수 있습니다.", advice: "자신감을 갖고 사람들을 리드하세요. 당신에게는 상황을 바꿀 충분한 능력이 있습니다." },

    /* 4. 화면 전환 및 이벤트 등록 */
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(id);
      if (target) {
        target.classList.add('active');
      }
    }

    function goToSpread() {
      showScreen('screenSpread');
      renderGridDeck();
      playCardShuffleSound();
    }

    /* 정확히 10장의 카드 그리드 배열 생성 */
    function renderGridDeck() {
      const wrapper = document.getElementById('deckWrapper');
      wrapper.innerHTML = '';
      
      const shuffledIndices = Array.from({ length: 22 }, (_, i) => i).sort(() => Math.random() - 0.5);
      const totalCards = 10;

      for (let i = 0; i < totalCards; i++) {
        const cardEl = document.createElement('div');
        cardEl.className = 'tarot-card-grid';

        cardEl.innerHTML = `
          <div class="card-inner-frame">
            <span class="card-number-badge">${i + 1}</span>
            <span style="font-size:0.6rem; color:rgba(245,208,97,0.7); margin-top:1px;">✦</span>
          </div>
        `;

        const cardDataIndex = shuffledIndices[i % 22];
        const onPick = () => pickCard(cardDataIndex, cardEl);
        cardEl.addEventListener('click', onPick);
        wrapper.appendChild(cardEl);
      }
    }

    function pickCard(cardIndex, cardEl) {
      cardEl.style.transform = 'translateY(-4px) scale(1.03)';
      cardEl.style.borderColor = '#fff';
      playCardShuffleSound();

      setTimeout(() => {
        showScreen('screenResult');
        displayResult(tarotDeck[cardIndex]);
      }, 300);
    }

    function displayResult(card) {
      const resultCard = document.getElementById('resultCard3D');
      resultCard.classList.remove('flipped');

      document.getElementById('resCardNum').innerText = card.num;
      document.getElementById('resCardIcon').innerText = card.icon;
      document.getElementById('resCardTitleKr').innerText = card.nameKr;
      document.getElementById('resCardTitleEn').innerText = card.nameEn;
      document.getElementById('resFortuneText').innerText = card.fortune;
      document.getElementById('resAdviceText').innerText = card.advice;

      setTimeout(() => {
        resultCard.classList.add('flipped');
        playChimeSound();
      }, 250);
    }

    function resetToCover() {
      showScreen('screenCover');
    }

    function goToHoroscope() {
      showScreen('screenHoroscope');
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      document.getElementById('todayDateBadge').innerText = `${year}년 ${month}월 ${day}일 오늘의 별빛`;
    }

    function getDailyHash(zodiacIdx) {
      const now = new Date();
      const dateNum = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
      return (dateNum * 31 + zodiacIdx * 17) % 10000;
    }

    function calculateHoroscopeBySelect() {
      const select = document.getElementById('zodiacSelect');
      const idx = parseInt(select.value);
      if (!isNaN(idx)) {
        showZodiacFortune(idx);
      }
    }

    function calculateHoroscopeByBirth() {
      const dateVal = document.getElementById('birthdayInput').value;
      if (!dateVal) return;
      const parts = dateVal.split('-');
      const month = parseInt(parts[1]);
      const day = parseInt(parts[2]);

      let idx = 0;
      if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) idx = 0;
      else if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) idx = 1;
      else if ((month == 5 && day >= 21) || (month == 6 && day <= 21)) idx = 2;
      else if ((month == 6 && day >= 22) || (month == 7 && day <= 22)) idx = 3;
      else if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) idx = 4;
      else if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) idx = 5;
      else if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) idx = 6;
      else if ((month == 10 && day >= 23) || (month == 11 && day <= 22)) idx = 7;
      else if ((month == 11 && day >= 23) || (month == 12 && day <= 24)) idx = 8;
      else if ((month == 12 && day >= 25) || (month == 1 && day <= 19)) idx = 9;
      else if ((month == 1 && day >= 23) || (month == 2 && day <= 18)) idx = 10;
      else idx = 11;

      document.getElementById('zodiacSelect').value = idx;
      showZodiacFortune(idx);
    }

    function showZodiacFortune(idx) {
      const z = zodiacData[idx];
      const hash = getDailyHash(idx);

      const genText = generalPhrases[hash % generalPhrases.length];
      const loveText = lovePhrases[(hash + 2) % lovePhrases.length];
      const moneyText = moneyPhrases[(hash + 4) % moneyPhrases.length];
      const color = colors[(hash + 1) % colors.length];
      const luckyNumber = (hash % 9) + 1;
      const luckyHour = (hash % 12) + 10;

      document.getElementById('zodiacIcon').innerText = z.icon;
      document.getElementById('zodiacName').innerText = z.name;
      document.getElementById('zodiacDateSpan').innerText = z.date;

      document.getElementById('zodiacGeneral').innerText = genText;
      document.getElementById('zodiacLove').innerText = loveText;
      document.getElementById('zodiacMoney').innerText = moneyText;

      document.getElementById('luckyColor').innerText = `행운의 색: ${color}`;
      document.getElementById('luckyNum').innerText = `행운의 수: ${luckyNumber}`;
      document.getElementById('luckyTime').innerText = `행운의 시간: ${luckyHour}:00`;

      document.getElementById('horoscopeResult').style.display = 'block';
      playChimeSound();
    }
